/* VOICE: direct, practical, trainer to trainer. Brand voice of ramvo.app.
   IDEA: a working session at the trainer's desk: laptop panel on the left, the client's phone on the right, both live.
   PICTURE: the two devices, reacting to each other as the trainer clicks.
   COLOUR and TYPE: Ramvo Performance Lab everywhere, dark only (cyan/magenta accents, Archivo 800 + Manrope).
   LAYOUT: modest title, stage with devices, step caption, then the time calculator and a sign-up band. */
:root{color-scheme:dark;
--bg:#0B0D10;--raised:#1F242B;--sunk:#15181C;
--ink:#F4F6F8;--mute:#8E97A3;--acc:#3EC6FF;
--accsoft:#122833;--line:#1F242B;--ok:#35D483;
--a0:#0B0D10;--a1:#15181C;--a2:#1F242B;--a3:#242A31;--at:#F4F6F8;--as:#8E97A3;--cy:#3EC6FF;--mg:#FF4D8D;--gr:#35D483;--wa:#FF4D8D;--cyk:#04161F}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Manrope,sans-serif;font-weight:800;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,4.6vw,52px)}h2{font-size:clamp(28px,3.4vw,40px)}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px max(5vw,16px)}
.wordmark{display:flex;align-items:center}.wordmark img{display:block;height:36px;width:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--raised)}
.lang button{border:0;background:none;color:var(--mute);min-width:48px;min-height:40px;border-radius:99px;font-weight:600}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 48px;align-items:end;padding-bottom:20px}
.intro p{color:var(--mute);font-size:17px;margin:0;max-width:60ch}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.steps button{border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:99px;padding:10px 18px;min-height:44px;font-weight:600}
.steps button[aria-current=true]{background:var(--acc);border-color:var(--acc);color:var(--cyk)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(16px,3vw,40px);align-items:center;background:var(--sunk);border-radius:22px;padding:clamp(14px,3vw,36px)}
.desk{background:var(--a0);border-radius:12px;box-shadow:0 30px 60px -30px #0007,0 0 0 1px #0003;overflow:hidden;color:var(--at);font-family:Manrope,sans-serif;font-size:14px}
.bar{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--a1);border-bottom:1px solid var(--a3)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--a3)}.bar span{margin-left:10px;color:var(--as);font-size:12px;background:var(--a0);padding:3px 12px;border-radius:6px;flex:1;max-width:280px}
.app{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:440px}
.side{background:var(--a1);padding:14px 8px;border-right:1px solid var(--a3)}.side div{padding:8px 10px;border-radius:6px;color:var(--as);font-size:13px}
.side div.on{background:#1c2a33;color:var(--cy);font-weight:700}.side .g{font-size:11px;padding:12px 10px 4px;color:var(--as)}
.main{padding:18px;position:relative}
.main h3,.ph h3{font:800 19px Archivo,sans-serif;margin:0 0 4px}.sub{color:var(--as);font-size:12.5px;margin:0 0 14px}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.card{background:var(--a1);border:1px solid var(--a3);border-radius:10px;padding:12px}
.lbl{font:700 11px Manrope,sans-serif;color:var(--as);letter-spacing:.04em;margin-bottom:8px}
.ex{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--a3)}.ex:first-of-type{border-top:0}
.th{width:54px;height:36px;border-radius:6px;flex:none;background:linear-gradient(135deg,#24404d,#15181c);display:grid;place-items:center;position:relative}
.th svg{width:14px;height:14px}.ex .n{flex:1;font-weight:600;font-size:13px}.ex small{display:block;color:var(--as);font-weight:500;font-size:11.5px}
.btn{border:0;border-radius:6px;padding:8px 12px;min-height:36px;font:700 12.5px Manrope,sans-serif;background:var(--cy);color:var(--cyk)}
.btn.ghost{background:var(--a2);color:var(--at)}.btn[disabled]{background:var(--a2);color:var(--gr);cursor:default}
.btn.big{min-height:44px;padding:10px 16px;font-size:14px}
.pulse{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{box-shadow:0 0 0 6px #3ec6ff33}}
.search{background:var(--a0);border:1px solid var(--a3);border-radius:6px;padding:8px 10px;color:var(--as);font-size:12.5px;margin-bottom:8px}
.cl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--a3)}.cl:first-of-type{border-top:0}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 11px Archivo,sans-serif;color:var(--cyk)}
.chk{width:22px;height:22px;border-radius:5px;border:2px solid var(--a3);background:none;flex:none;display:grid;place-items:center;padding:0}
.chk[aria-pressed=true]{background:var(--cy);border-color:var(--cy)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--a2);color:var(--as);white-space:nowrap}
.tag.ok{background:#13311F;color:var(--gr)}.tag.wa{background:#3A1426;color:var(--wa)}.tag.cy{background:#1c2a33;color:var(--cy)}
.toast{position:absolute;right:18px;bottom:18px;background:var(--gr);color:#06170d;font:700 13px Manrope,sans-serif;padding:10px 14px;border-radius:8px;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.feed div{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--a3);font-size:12.5px;animation:in .4s ease both}.feed div:first-child{border-top:0}
.feed b{color:var(--cy)}.feed time{margin-left:auto;color:var(--as);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi b{display:block;font:800 22px Archivo,sans-serif}.kpi span{font-size:11.5px;color:var(--as)}
.fig{position:relative;height:120px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.phw{justify-self:center;width:100%;max-width:300px}
.phone{aspect-ratio:9/19;background:#000;border-radius:44px;padding:10px;box-shadow:0 40px 70px -30px #0008}
.ph{height:100%;background:var(--a0);border-radius:35px;overflow:hidden;position:relative;color:var(--at);font-family:Manrope,sans-serif;font-size:13px;padding:40px 16px 16px}
.ph::before{content:"";position:absolute;top:10px;left:50%;translate:-50% 0;width:84px;height:24px;border-radius:99px;background:#000}
.hi{font:800 22px Archivo,sans-serif;margin:0}.date{color:var(--as);font-size:12px;margin-bottom:14px}
.pc{background:var(--a1);border-radius:14px;padding:12px;margin-bottom:10px}
.pc.new{outline:2px solid var(--cy);animation:in .5s ease both}
.streak{display:flex;align-items:center;gap:10px}.streak b{font:800 28px Archivo,sans-serif;color:var(--mg)}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--a2)}.dots i.on{background:var(--mg)}
.push{position:absolute;left:10px;right:10px;top:40px;background:#2a2f36ee;backdrop-filter:blur(8px);border-radius:16px;padding:10px 12px;display:flex;gap:10px;animation:drop .5s cubic-bezier(.2,.9,.3,1.2) both;z-index:2}
@keyframes drop{from{transform:translateY(-120%)}}.push .ic{width:30px;height:30px;border-radius:8px;flex:none;overflow:hidden}.push .ic img{display:block;width:100%;height:100%}
.push b{display:block;font-size:12.5px}.push span{font-size:12px;color:#c9ced5}
.vid{height:150px;border-radius:12px;background:linear-gradient(160deg,#24404d,#0b0d10);display:grid;place-items:center;margin:8px 0 10px;position:relative}
.vid svg{width:44px;height:44px}.vid small{position:absolute;left:10px;bottom:8px;color:#c9ced5;font-size:11px}
.sets{display:flex;gap:6px;margin:10px 0}.sets i{flex:1;height:34px;border-radius:8px;background:var(--a2);display:grid;place-items:center;font:700 12px Manrope,sans-serif;font-style:normal;color:var(--as)}
.sets i.on{background:var(--gr);color:#06170d}
.ring{display:flex;gap:12px;align-items:center}
.cap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px 32px;align-items:start;margin-top:22px}
.cap h3{font-size:24px;margin-bottom:6px}.cap p{margin:0;color:var(--mute)}
.vs{display:grid;gap:8px;font-size:14.5px}.vs div{display:flex;gap:10px}.vs span{flex:none;font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;height:fit-content;white-space:nowrap}
.vs .b span{background:var(--line);color:var(--mute)}.vs .a span{background:var(--accsoft);color:var(--acc)}
.next{border:0;background:var(--acc);color:var(--cyk);border-radius:99px;padding:12px 22px;min-height:48px;font-weight:600;white-space:nowrap}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start;margin-top:26px}
.res{background:var(--acc);color:var(--cyk);border-radius:22px;padding:clamp(22px,3vw,36px)}
.res .big{font:800 clamp(56px,9vw,104px)/1 Archivo,sans-serif;white-space:nowrap}.res p{margin:8px 0 0;opacity:.92}
.range{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px;border-top:1px solid #04161F40;padding-top:16px}
.range b{display:block;font:800 22px Archivo,sans-serif;white-space:nowrap}.range span{font-size:13px;opacity:.85}
.field{margin-bottom:18px}.field label{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-bottom:6px}.field label output{color:var(--acc);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.as{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}.as th{text-align:right;font-size:12.5px;color:var(--mute);font-weight:600;padding:6px 4px}.as th:first-child{text-align:left}
.as td{padding:6px 4px;border-top:1px solid var(--line);text-align:right}.as td:first-child{text-align:left}
.as input{width:64px;font:16px Manrope,sans-serif;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);text-align:right}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.cta{background:var(--sunk);color:var(--ink)}.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta p{margin:8px 0 0;opacity:.8;max-width:60ch}.cta a{background:var(--acc);color:var(--cyk);text-decoration:none;font-weight:600;padding:14px 26px;border-radius:99px;min-height:48px;display:inline-flex;align-items:center}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.phw{max-width:270px}.cap{grid-template-columns:minmax(0,1fr)}.intro,.calc{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.cols{grid-template-columns:minmax(0,1fr)}.range{grid-template-columns:minmax(0,1fr)}.kpi b{font-size:18px}.toast{position:static;display:inline-block;margin-top:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

lib:'Exercise library',libs:'Every exercise with a short form video',search:'Search: legs',add:'Add',added:'Added',day:'Plan: Strength, December',dayA:'Day A: Legs',empty:'Add exercises from the library',
ex:[['Front squat','Legs · barbell'],['Hip thrust','Glutes · barbell'],['Bulgarian split squat','Legs · dumbbells'],['Leg curl','Legs · machine'],['Leg press','Legs · machine']],
cli:'My clients',clis:'Assign plan: Strength, December',assign:n=>'Assign plan ('+n+')',sent:n=>'Sent to '+n+' clients',
tier:['Full','Workout'],names:['Emma Reid','Tom Hughes','Sophie Lane','James Patel','Olivia Shaw'],

prof:'Emma Reid',profs:'Client for 9 weeks · Plan: Strength, December',k:['−3.6 kg','weight since start'],k2:['+20 kg','front squat'],k3:['12 days','training streak'],
wch:'Weight, kg',sch:'Front squat, kg',risk:'Needs attention',riskT:'Tom: 6 days without a session',write:'Message',

const COL=['#3EC6FF','#FF4D8D','#35D483','#F4F6F8','#8E97A3'];
let L='pl',S={step:0,added:[0,1],sel:[true,true,true,false,false],assigned:false,sets:1};
let A=[[10,0.5],[10,2],[8,3]];
try{const h=location.hash.slice(1);if(h==='en'||h==='pl')L=h;else{const s=localStorage.getItem('ramvo-lang');if(s)L=s}}catch(e){}
const $=id=>document.getElementById(id);
const ini=n=>n.split(' ').map(w=>w[0]).join('');
function side(t){$('side').innerHTML=t.side.map(([k,v])=>`<div class="${k==='g'?'g':''}${(k==='lib'&&S.step===0)||(k==='cli'&&S.step>0)?' on':''}">${v}</div>`).join('')}
function desk(t){
 let h='';
 if(S.step===0){
  h=`<h3>${t.lib}</h3><p class="sub">${t.libs}</p><div class="cols"><div class="card"><div class="search">${t.search}</div>${t.ex.map((e,i)=>`<div class="ex"><div class="th">${play}</div><div class="n">${e[0]}<small>${e[1]}</small></div><button class="btn${S.added.includes(i)?'':(i===2?' pulse':'')}" data-add="${i}" ${S.added.includes(i)?'disabled':''}>${S.added.includes(i)?t.added:t.add}</button></div>`).join('')}</div>
  <div class="card"><div class="lbl">${t.day}</div><div style="font-weight:700;margin-bottom:6px">${t.dayA}</div>${S.added.map((i,k)=>`<div class="ex" style="animation:in .4s ease both"><div class="th" style="width:40px;height:28px">${play}</div><div class="n">${t.ex[i][0]}<small>4 × 8 · 90 s</small></div></div>`).join('')||`<p class="sub">${t.empty}</p>`}</div></div>`;
 }else if(S.step===1){
  const n=S.sel.filter(Boolean).length;
  h=`<h3>${t.cli}</h3><p class="sub">${t.clis}</p><div class="card">${t.names.map((m,i)=>`<div class="cl"><button class="chk" aria-pressed="${S.sel[i]}" data-sel="${i}" aria-label="${m}">${S.sel[i]?'<svg width="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-6" stroke="#04161F" stroke-width="2.2" fill="none"/></svg>':''}</button><div class="av" style="background:${COL[i]}">${ini(m)}</div><div class="n" style="flex:1;font-weight:600">${m}</div>${S.assigned&&S.sel[i]?`<span class="tag ok">${t.added}</span>`:`<span class="tag">${t.tier[i<3?0:1]}</span>`}</div>`).join('')}</div>
  <div style="margin-top:12px"><button class="btn big${S.assigned?'':' pulse'}" id="assign" ${S.assigned||!n?'disabled':''}>${S.assigned?t.sent(n):t.assign(n)}</button></div>${S.assigned?`<div class="toast">${t.sent(n)} · 0:01</div>`:''}`;
 }else if(S.step===2){
  const f=[];for(let i=1;i<=S.sets;i++)f.unshift(`<div><b>${t.names[0].split(' ')[0]}</b> ${t.feed[0][1]} ${i}/4 · ${t.feed[0][2]}<time>${i===S.sets?t.now:(S.sets-i)*2+' min'}</time></div>`);
  h=`<h3>${t.act}</h3><p class="sub"><span class="tag cy">${t.live}</span></p><div class="cols"><div class="card"><div class="lbl">${t.todayW}</div><div class="feed">${f.join('')}</div></div>
  <div class="card"><div class="lbl">${t.wk}</div>${t.names.slice(0,4).map((m,i)=>`<div class="cl"><div class="av" style="background:${COL[i]}">${ini(m)}</div><div style="flex:1;font-weight:600">${m.split(' ')[0]}</div><span class="tag ${i===1?'wa':'ok'}">${[3,0,2,2][i]}/3</span></div>`).join('')}</div></div>`;
 }else{
  h=`<h3>${t.prof}</h3><p class="sub">${t.profs}</p><div class="kpis">${[t.k,t.k2,t.k3].map((k,i)=>`<div class="card kpi"><b style="color:${['var(--gr)','var(--cy)','var(--mg)'][i]}">${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>
  <div class="cols"><div class="card"><div class="lbl">${t.wch}</div><div class="fig"><svg id="g1"></svg></div></div><div class="card"><div class="lbl">${t.sch}</div><div class="fig"><svg id="g2"></svg></div></div></div>
  <div class="card" style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="tag wa">${t.risk}</span><span style="flex:1">${t.riskT}</span><button class="btn ghost">${t.write}</button></div>`;
 }
 $('desk').innerHTML=h;if(S.step===3)charts();
}
function phone(t){
 let h='';const st=`<div class="pc"><div class="streak"><b>${S.step===3?12:11}</b><div><div style="font-weight:700">${t.streak}</div><div class="dots">${[1,1,1,1,1,0,0].map((o,i)=>`<i class="${o||(S.step>=2&&i===5)?'on':''}"></i>`).join('')}</div></div></div></div>`;
 if(S.step<=1){
  h=`<p class="hi">${t.hello}</p><div class="date">${t.date}</div>${S.assigned?`<div class="pc new"><div class="lbl" style="color:var(--cy)">${t.noplan}</div><div style="font:800 17px Archivo,sans-serif">${t.newplan}</div><div style="color:var(--as);font-size:12px;margin-bottom:10px">${t.newplans}</div><button class="btn" style="width:100%" data-go="2">${t.start}</button></div>`:`<div class="pc"><div class="lbl">${t.noplan}</div><div style="color:var(--as)">${t.noplans}</div></div>`}${st}
  <div class="pc ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" stroke="#1F242B" stroke-width="6" fill="none"/><circle cx="22" cy="22" r="18" stroke="#3EC6FF" stroke-width="6" fill="none" stroke-dasharray="113" stroke-dashoffset="40" transform="rotate(-90 22 22)" stroke-linecap="round"/></svg><div><div style="font-weight:700">${t.macro}</div><div style="color:var(--as)">92 / 140 g</div></div></div>
  ${S.assigned?`<div class="push"><div class="ic"><img src="/assets/brand/favicon/favicon.svg" alt=""></div><div><b>${t.pushT}</b><span>${t.pushB}</span></div></div>`:''}`;
 }else if(S.step===2){
  const d=S.sets>=4;
  h=`<div class="lbl">${t.todayW}</div><h3>${t.ex[0][0]}</h3><div style="color:var(--as)">4 × 8 · 60 kg · 90 s</div><div class="vid">${play}<small>${t.tech}</small></div>
  <div class="sets">${[1,2,3,4].map(i=>`<i class="${i<=S.sets?'on':''}">${t.set} ${i}</i>`).join('')}</div>
  <button class="btn big${d?'':' pulse'}" style="width:100%" id="log" ${d?'disabled':''}>${d?t.done:t.logset}</button>
  <div class="pc" style="margin-top:12px">${t.ex.slice(1,3).map(e=>`<div class="ex"><div class="th" style="width:40px;height:28px">${play}</div><div class="n">${e[0]}<small>4 × 8</small></div></div>`).join('')}</div>`;
 }else{
  h=`<p class="hi">${t.prog}</p><div class="date">${t.date}</div>${st}<div class="pc"><div class="lbl">${t.wch}</div><div class="fig" style="height:90px"><svg id="g3"></svg></div></div>
  <div class="pc" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[0,1].map(i=>`<div style="aspect-ratio:3/4;border-radius:10px;background:linear-gradient(${i?'200deg,#24404d,#15181c':'160deg,#2a2f36,#15181c'});display:grid;place-items:end start;padding:6px;font-size:11px;color:#c9ced5">${i?'1.12':'6.10'}</div>`).join('')}</div>`;
 }
 $('phone').innerHTML=h;if(S.step===3)charts();
}
function line(svg,data,col,lo,hi){if(!svg)return;const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const p=6;
 const x=i=>p+i*(W-2*p)/(data.length-1),y=v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
 const d=data.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
 svg.innerHTML=`<path d="${d} L${x(data.length-1)} ${H} L${x(0)} ${H}Z" fill="${col}22"/><path d="${d}" stroke="${col}" stroke-width="2.5" fill="none" stroke-linejoin="round"/><circle cx="${x(data.length-1)}" cy="${y(data[data.length-1])}" r="4" fill="${col}"/><text x="${x(data.length-1)-8}" y="${y(data[data.length-1])<H/2?y(data[data.length-1])+16:y(data[data.length-1])-10}" text-anchor="end" fill="#8E97A3" font-size="11" font-family="Manrope">${String(data[data.length-1]).replace('.',L==='pl'?',':'.')}</text>`}
function charts(){const w=[71.2,70.8,70.1,69.9,69.2,68.8,68.3,67.9,67.6],s=[40,45,45,47.5,50,52.5,55,57.5,60];
 line($('g1'),w,'#35D483',66.5,72);line($('g2'),s,'#3EC6FF',35,62);line($('g3'),w,'#35D483',66.5,72)}
new ResizeObserver(()=>{if(S.step===3)charts()}).observe(document.body);
function cap(t){const c=t.cap[S.step];$('c-h').textContent=c[0];$('c-p').textContent=c[1];
 $('c-vs').innerHTML=`<div class="b"><span>${t.today}</span>${c[2][0]}</div><div class="a"><span>Ramvo</span>${c[2][1]}</div>`;
 $('next').textContent=S.step===3?t.again:t.next;
 $('steps').innerHTML=t.steps.map((s,i)=>`<button data-step="${i}" aria-current="${i===S.step}">${s}</button>`).join('')}
const fmt=v=>{const r=Math.round(v*10)/10;return (Number.isInteger(r)?String(r):r.toFixed(1)).replace('.',L==='pl'?',':'.')};
function perClient(){return (A[0][0]-A[0][1])+(A[1][0]-A[1][1])+(A[2][0]-A[2][1])*52/12}
function calc(){const t=T[L],n=+$('n').value,pc=perClient();$('nv').textContent=n;
 $('hrs').textContent=fmt(pc*n/60)+' '+t.h;$('hrsl').textContent=t.hl(n);
 $('r10').textContent=fmt(pc*10/60)+' '+t.h;$('r30').textContent=fmt(pc*30/60)+' '+t.h;$('rw').textContent=fmt(pc*n/60*12/52)+' '+t.h}
function rows(t){$('rows').innerHTML=t.rows.map((r,i)=>`<tr><td>${r[0]} <span style="color:var(--mute);font-size:12.5px">/ ${r[1]}</span></td>${[0,1].map(j=>`<td><input type="number" min="0" max="120" step="0.5" inputmode="decimal" id="a${i}${j}" value="${A[i][j]}" aria-label="${r[0]} ${j?'Ramvo':t.today}"></td>`).join('')}</tr>`).join('')}
function render(){const t=T[L];document.documentElement.lang=L;
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
 for(const k of ['h1','lead','sample','ch','cp','cl','task','today','anote','fh','fp','fb'])$('t-'+k)&&($('t-'+k).textContent=t[k]);
 $('r10l').textContent=t.r10;$('r30l').textContent=t.r30;$('rwl').textContent=t.rw;
 side(t);desk(t);phone(t);cap(t);calc()}
function go(i){S.step=i;if(i===0){S.added=[0,1]}if(i<=1){S.assigned=false}if(i===2)S.sets=1;if(i>=2)S.assigned=true;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){L=b.dataset.l;try{localStorage.setItem('ramvo-lang',L);history.replaceState(null,'','#'+L)}catch(x){}rows(T[L]);render();return}
 if(b.dataset.step){go(+b.dataset.step);return}
 if(b.dataset.go){go(+b.dataset.go);return}
 if(b.dataset.add){S.added.push(+b.dataset.add);render();return}
 if(b.dataset.sel){if(S.assigned)return;S.sel[+b.dataset.sel]=!S.sel[+b.dataset.sel];render();return}
 if(b.id==='assign'){S.assigned=true;render();return}
 if(b.id==='log'){S.sets=Math.min(4,S.sets+1);render();return}
 if(b.id==='next'){go(S.step===3?0:S.step+1)}});
document.addEventListener('input',e=>{const m=e.target.id.match(/^a(\d)(\d)$/);if(m){const v=parseFloat(e.target.value);A[+m[1]][+m[2]]=isFinite(v)&&v>=0?v:0;calc()}if(e.target.id==='n')calc()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='en'||h==='pl'){L=h;rows(T[L]);render()}});
rows(T[L]);render();
}
</script>
</body>
</html>
