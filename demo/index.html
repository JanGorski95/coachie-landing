<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainer Ramvo Demo</title>
<meta name="description" content="Interactive demo of the Ramvo trainer panel: dashboard, clients, plans, sessions, messages, budget and profile. Clickable, on demo-account data.">
<link rel="canonical" href="https://ramvo.app/demo/">
<link rel="alternate" hreflang="en" href="https://ramvo.app/demo/">
<link rel="alternate" hreflang="pl" href="https://ramvo.app/demo/?lang=pl">
<link rel="alternate" hreflang="x-default" href="https://ramvo.app/demo/">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" href="/assets/brand/favicon/favicon.ico" sizes="any">
<link rel="icon" href="/assets/brand/favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/brand/favicon/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ramvo">
<meta property="og:title" content="Trainer Ramvo Demo">
<meta property="og:description" content="Click through the Ramvo trainer panel: clients, plans, sessions, messages and budget.">
<meta property="og:image" content="https://ramvo.app/assets/brand/ramvo-og-1200x630-1200.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ramvo.app/demo/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/panel-demo/demo.css?v=4">
<style>
:root { color-scheme: dark; --bg: #0B0D10; --fg: #F4F6F8; --muted: #8E97A3; --accent: #3EC6FF; --accent-fg: #04161F; --border: #1F242B; --sunk: #15181C; }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 'Manrope', system-ui, sans-serif; overflow-x: clip; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px max(16px, 2.5vw); border-bottom: 1px solid var(--border); }
.top .l { display: flex; align-items: center; gap: 14px; }
.top img { height: 30px; display: block; }
.top h1 { font: 800 15px 'Archivo', sans-serif; margin: 0; color: var(--muted); }
.top .r { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; gap: 3px; background: #1F242B; border-radius: 999px; padding: 3px; }
.lang button { font: 700 12px 'Manrope', sans-serif; border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.lang button.active { background: var(--sunk); color: var(--fg); }
.cta { font: 700 14px 'Manrope', sans-serif; color: var(--accent-fg); background: var(--accent); border-radius: 999px; padding: 9px 16px; text-decoration: none; white-space: nowrap; }
.back { font: 700 14px 'Manrope', sans-serif; color: var(--muted); text-decoration: none; white-space: nowrap; }
.back:hover { color: var(--fg); }
main { padding: 16px max(16px, 2.5vw) 28px; }
.note { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .top h1, .back { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="l"><a href="/trainers/"><img src="/assets/brand/ramvo-wordmark-ciemne-tlo.svg" alt="Ramvo" height="30"></a><h1 data-t="title">Demo panelu trenera</h1></div>
  <div class="r">
    <a class="back" href="/trainers/" data-t="back">← O panelu</a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div>
    <a class="cta" href="/trainers/#form" data-t="cta">Zgłoś się</a>
  </div>
</header>
<main>
  <div id="panel-demo"></div>
  <p class="note" data-t="note">Dane z konta demo: imiona klientów skrócone, kwoty i daty przykładowe. Nic nie jest zapisywane, przycisk „Od nowa” przywraca stan początkowy.</p>
</main>
<script src="/assets/panel-demo/demo.js?v=6"></script>
<script>
(function () {
  var T = {
    pl: { title: 'Demo panelu trenera', back: '← O panelu', cta: 'Zgłoś się', note: 'Dane z konta demo: imiona klientów skrócone, kwoty i daty przykładowe. Nic nie jest zapisywane, przycisk „Od nowa” przywraca stan początkowy.' },
    en: { title: 'Trainer panel demo', back: '← About the panel', cta: 'Apply', note: 'Data from the demo account: client names shortened, amounts and dates are examples. Nothing is saved; "Reset" restores the starting state.' }
  };
  var MODS = ['dashboard', 'clients', 'plans', 'sessions', 'messages', 'budget', 'profile'];
  var q = new URLSearchParams(location.search), m = q.get('m');
  var lang = 'pl';
  try { var s = localStorage.getItem('ramvo-lang'); if (s === 'pl' || s === 'en') lang = s; else if ((navigator.language || '').toLowerCase().indexOf('en') === 0) lang = 'en'; } catch (e) {}
  function apply(l) {
    lang = l; document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[l][el.getAttribute('data-t')]; });
    document.querySelectorAll('.lang button').forEach(function (b) { var on = b.getAttribute('data-lang') === l; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
    try { localStorage.setItem('ramvo-lang', l); } catch (e) {}
    if (window.RamvoDemo) RamvoDemo.setLang(l);
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.addEventListener('click', function () { apply(b.getAttribute('data-lang')); }); });
  apply(lang);
  RamvoDemo.mount(document.getElementById('panel-demo'), {
    start: MODS.indexOf(m) >= 0 ? m : 'dashboard',
    tour: !m && q.get('tour') !== '0',
    h: 'max(600px, calc(100vh - 150px))',
    cta: { href: '/trainers/#form', pl: 'Zgłoś się jako Founding Trainer', en: 'Apply as a Founding Trainer' }
  });
})();
</script>
</body>
</html>
