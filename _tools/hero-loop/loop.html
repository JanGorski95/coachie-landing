<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Manrope:wght@500;600;700&display=block">
<style>
/* Hero loop for ramvo.app: 360x780 CSS px rendered at 2x = 720x1560.
   Every visual is driven by render(t) (t in seconds, 0..12), no CSS
   animations, so each frame is deterministic. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 360px; height: 780px; overflow: hidden; background: #0B0D10; }
body { font-family: Manrope, sans-serif; color: #F4F6F8; font-size: 15px; }
.scene { position: absolute; inset: 0; padding: 58px 20px 24px; opacity: 0; }
.day { position: absolute; top: 58px; left: 20px; font: 800 13px Archivo, sans-serif; letter-spacing: .14em; color: #3EC6FF; background: #122833; border-radius: 99px; padding: 7px 14px; z-index: 5; }
.body { padding-top: 52px; }
.hi { font: 800 30px Archivo, sans-serif; margin-bottom: 4px; }
.date { color: #8E97A3; font-size: 14px; margin-bottom: 20px; }
.card { background: #15181C; border-radius: 20px; padding: 18px; margin-bottom: 14px; position: relative; }
.lbl { font-size: 12px; font-weight: 700; color: #8E97A3; letter-spacing: .04em; margin-bottom: 6px; }
.muted { color: #8E97A3; }
.btn { background: #3EC6FF; color: #04161F; font-weight: 700; text-align: center; border-radius: 12px; padding: 13px; font-size: 15px; }
.push { position: absolute; left: 12px; right: 12px; top: 54px; background: #2a2f36; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; z-index: 6; box-shadow: 0 18px 40px -12px #000c; }
.push img { width: 40px; height: 40px; border-radius: 10px; }
.push b { display: block; font-size: 15px; }
.push span { font-size: 14px; color: #c9ced5; }
.streak { display: flex; align-items: center; gap: 16px; }
.streak .n { font: 800 44px Archivo, sans-serif; color: #FF4D8D; min-width: 56px; }
.dots { display: flex; gap: 6px; margin-top: 10px; }
.dots i { width: 22px; height: 8px; border-radius: 4px; background: #1F242B; }
.dots i.on { background: #FF4D8D; }
.vid { height: 210px; border-radius: 18px; background: linear-gradient(160deg, #24404d, #0b0d10); position: relative; overflow: hidden; margin: 14px 0; }
.sheen { position: absolute; top: 0; bottom: 0; width: 160px; background: linear-gradient(90deg, transparent, #3EC6FF22, transparent); }
.pause { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: #0B0D10aa; display: flex; gap: 8px; align-items: center; justify-content: center; }
.pause i { width: 7px; height: 22px; border-radius: 2px; background: #F4F6F8; }
.nx { display: flex; gap: 12px; align-items: center; padding: 8px 0; }
.nx i { width: 52px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #24404d, #15181c); flex: none; }
.nx b { display: block; font-size: 15px; }
.nx span { font-size: 13px; }
.vid small { position: absolute; left: 14px; bottom: 12px; font-size: 13px; color: #c9ced5; }
.vid .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: #3EC6FF; }
.sets { display: flex; gap: 8px; margin: 14px 0; }
.sets i { flex: 1; height: 48px; border-radius: 12px; background: #1F242B; display: grid; place-items: center; font: 700 14px Manrope; font-style: normal; color: #8E97A3; }
.sets i.on { background: #35D483; color: #06170d; }
.badge { display: flex; gap: 14px; align-items: center; }
.medal { width: 58px; height: 58px; border-radius: 50%; background: #FF4D8D; display: grid; place-items: center; font: 800 22px Archivo, sans-serif; box-shadow: 0 0 0 6px #3A1426; flex: none; }
.chart { height: 190px; position: relative; }
.chart svg { width: 100%; height: 100%; overflow: visible; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kpi b { display: block; font: 800 26px Archivo, sans-serif; }
</style>
</head>
<body>

<!-- 1. Monday: new plan from the trainer -->
<div class="scene" id="s1">
  <div class="day" data-t="d1"></div>
  <div class="push" id="push"><img src="../../assets/brand/favicon/favicon.svg" alt=""><div><b data-t="pushT"></b><span data-t="pushB"></span></div></div>
  <div class="body">
    <div class="hi" data-t="hi"></div>
    <div class="date" data-t="date1"></div>
    <div style="position:relative;height:176px;margin-bottom:14px">
      <div class="card" id="planEmpty" style="position:absolute;inset:0 0 auto 0"><div class="lbl" data-t="planLabel"></div><div class="muted" data-t="noPlan"></div></div>
      <div class="card" id="planNew" style="outline:2px solid #3EC6FF;position:absolute;inset:0 0 auto 0">
        <div class="lbl" style="color:#3EC6FF" data-t="planLabel"></div>
        <div style="font:800 24px Archivo,sans-serif" data-t="planTitle"></div>
        <div class="muted" style="font-size:14px;margin-bottom:14px" data-t="planMeta"></div>
        <div class="btn" data-t="start"></div>
      </div>
    </div>
    <div class="card"><div class="streak"><div class="n">11</div><div><b data-t="streak"></b><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div></div></div></div>
    <div class="card streak"><svg width="58" height="58" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" stroke="#1F242B" stroke-width="6" fill="none"/><circle cx="22" cy="22" r="18" stroke="#3EC6FF" stroke-width="6" fill="none" stroke-dasharray="113" stroke-dashoffset="40" transform="rotate(-90 22 22)" stroke-linecap="round"/></svg><div><b data-t="protein"></b><div class="muted">92 / 140 g</div></div></div>
  </div>
</div>

<!-- 2. Wednesday: ticking off sets while the technique video plays -->
<div class="scene" id="s2">
  <div class="day" data-t="d2"></div>
  <div class="body">
    <div class="lbl" data-t="dayA"></div>
    <div class="hi" style="font-size:28px" data-t="ex"></div>
    <div class="muted">4 × 8 · 60 kg · 90 s</div>
    <div class="vid">
      <div class="sheen" id="sheen"></div>
      <div class="pause"><i></i><i></i></div>
      <small><span data-t="tech"></span> · <span id="tc">0:00</span> / 0:42</small>
      <div class="bar" id="vbar"></div>
    </div>
    <div class="sets" id="sets"><i></i><i></i><i></i><i></i></div>
    <div class="btn" id="logBtn"></div>
    <div class="card" style="margin-top:16px">
      <div class="lbl" data-t="next"></div>
      <div class="nx"><i></i><div><b>Hip thrust</b><span class="muted">4 × 10</span></div></div>
      <div class="nx"><i></i><div><b data-t="ex3"></b><span class="muted">3 × 8</span></div></div>
    </div>
  </div>
</div>

<!-- 3. Friday: streak 11 -> 12 and a badge -->
<div class="scene" id="s3">
  <div class="day" data-t="d3"></div>
  <div class="body">
    <div class="hi" data-t="streakTitle"></div>
    <div class="date" data-t="date3"></div>
    <div class="card" style="text-align:center;padding:28px 18px">
      <div style="font:800 96px/1 Archivo,sans-serif;color:#FF4D8D" id="bigN">11</div>
      <div style="font-weight:700;margin:6px 0 16px" data-t="streak"></div>
      <div class="dots" style="justify-content:center" id="dots3"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i id="dot6"></i><i></i></div>
    </div>
    <div class="card badge" id="badge"><div class="medal">12</div><div><b style="font-size:17px" data-t="badgeT"></b><div class="muted" data-t="badgeB"></div></div></div>
  </div>
</div>

<!-- 4. Sunday: weight chart draws downward -->
<div class="scene" id="s4">
  <div class="day" data-t="d4"></div>
  <div class="body">
    <div class="hi" data-t="prog"></div>
    <div class="date" data-t="date4"></div>
    <div class="card">
      <div class="lbl" data-t="weight"></div>
      <div class="chart"><svg viewBox="0 0 300 190" preserveAspectRatio="none"><path id="area" fill="#35D48322" d=""/><path id="line" fill="none" stroke="#35D483" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" d=""/><circle id="dotEnd" r="7" fill="#35D483"/></svg></div>
    </div>
    <div class="kpis">
      <div class="card kpi"><b style="color:#35D483" id="kg">0</b><span class="muted" data-t="sinceStart"></span></div>
      <div class="card kpi"><b style="color:#3EC6FF">+20 kg</b><span class="muted" data-t="squat"></span></div>
    </div>
  </div>
</div>

<script>
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'pl';
const TXT = {
  pl: { d1: 'PONIEDZIAŁEK', d2: 'ŚRODA', d3: 'PIĄTEK', d4: 'NIEDZIELA', pushT: 'Nowy plan od trenera', pushB: 'Siła, grudzień jest już w Twojej aplikacji.',
    hi: 'Cześć, Kasia', date1: 'poniedziałek, 30 listopada', planLabel: 'PLAN NA GRUDZIEŃ', noPlan: 'Trener jeszcze nie przypisał planu', planTitle: 'Siła, grudzień', planMeta: '12 treningów · 4 tygodnie', start: 'Zacznij dzień A',
    streak: 'dni z rzędu', protein: 'Białko dziś', dayA: 'DZIEŃ A: NOGI', ex: 'Przysiad przedni', tech: 'Technika', next: 'NASTĘPNE', ex3: 'Przysiad bułgarski', set: 'Seria', log: 'Zapisz serię', done: 'Ćwiczenie ukończone',
    streakTitle: 'Twoja passa', date3: 'piątek, 4 grudnia', badgeT: 'Nowa odznaka', badgeB: '12 dni treningów z rzędu', prog: 'Twoje postępy', date4: 'niedziela, 6 grudnia', weight: 'WAGA, KG', sinceStart: 'waga od startu', squat: 'przysiad przedni', kgFmt: v => '−' + v.toFixed(1).replace('.', ',') + ' kg' },
  en: { d1: 'MONDAY', d2: 'WEDNESDAY', d3: 'FRIDAY', d4: 'SUNDAY', pushT: 'New plan from your trainer', pushB: 'Strength, December is now in your app.',
    hi: 'Hi, Emma', date1: 'Monday, 30 November', planLabel: 'DECEMBER PLAN', noPlan: 'Your trainer has not assigned a plan yet', planTitle: 'Strength, December', planMeta: '12 sessions · 4 weeks', start: 'Start day A',
    streak: 'days in a row', protein: 'Protein today', dayA: 'DAY A: LEGS', ex: 'Front squat', tech: 'Technique', next: 'UP NEXT', ex3: 'Bulgarian split squat', set: 'Set', log: 'Log set', done: 'Exercise complete',
    streakTitle: 'Your streak', date3: 'Friday, 4 December', badgeT: 'New badge', badgeB: '12 training days in a row', prog: 'Your progress', date4: 'Sunday, 6 December', weight: 'WEIGHT, KG', sinceStart: 'weight since start', squat: 'front squat', kgFmt: v => '−' + v.toFixed(1) + ' kg' }
}[LANG];
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = TXT[el.dataset.t]; });

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// weight series for the Sunday chart
const W = [71.2, 70.8, 70.1, 69.9, 69.2, 68.8, 68.3, 67.9, 67.6];
const pts = W.map((v, i) => [10 + i * 280 / (W.length - 1), 20 + (71.6 - v) / (71.6 - 67.2) * 150]);


window.render = function (t) {
  t = ((t % 12) + 12) % 12;
  // dip to black between scenes (out over the last H s, in over the first H s),
  // which reads cleaner than cross-fading two different layouts; the loop
  // point 12 -> 0 is the same dip, so it repeats seamlessly
  const H = 0.15;
  const slot = s => (t >= s && t < s + 3) ? Math.min(prog(t, s, s + H), 1 - prog(t, s + 3 - H, s + 3)) : 0;
  const o1 = slot(0), o2 = slot(3), o3 = slot(6), o4 = slot(9);
  $('s1').style.opacity = o1; $('s2').style.opacity = o2; $('s3').style.opacity = o3; $('s4').style.opacity = o4;

  // 1. Monday. During the closing cross-fade (t > 11.7) scene 1 shows its t=0 state.
  const t1 = t > 6 ? 0 : t;
  const p = back(prog(t1, 0.5, 1.0));
  $('push').style.transform = `translateY(${(-130 + 130 * p).toFixed(1)}px)`;
  $('push').style.opacity = prog(t1, 0.5, 0.7);
  const swap = easeOut(prog(t1, 1.3, 1.7));
  $('planEmpty').style.opacity = 1 - swap;
  $('planNew').style.opacity = swap;
  $('planNew').style.transform = `scale(${(0.94 + 0.06 * swap).toFixed(3)})`;

  // 2. Wednesday: video progress, figure squats, sets fill at 3.7 / 4.3 / 4.9 / 5.4
  const l2 = t - 3;
  $('vbar').style.width = (clamp(l2 / 3) * 100).toFixed(1) + '%';
  const sec = Math.floor(clamp(l2 / 3) * 14);
  $('tc').textContent = '0:' + String(sec).padStart(2, '0');
  $('sheen').style.left = (-160 + clamp(l2 / 3) * 480).toFixed(1) + 'px';
  const done = [3.7, 4.3, 4.9, 5.4].filter(x => t >= x && t < 6).length;
  [...$('sets').children].forEach((el, i) => { el.className = i < done ? 'on' : ''; el.textContent = TXT.set + ' ' + (i + 1); });
  $('logBtn').textContent = done >= 4 ? TXT.done : TXT.log;
  $('logBtn').style.background = done >= 4 ? '#35D483' : '#3EC6FF';
  $('logBtn').style.color = done >= 4 ? '#06170d' : '#04161F';

  // 3. Friday: 11 -> 12 with a bump, sixth dot fills, badge pops
  const bump = prog(t, 6.9, 7.3);
  $('bigN').textContent = t >= 7.0 && t < 9 ? '12' : '11';
  $('bigN').style.transform = `scale(${(1 + Math.sin(bump * Math.PI) * 0.18).toFixed(3)})`;
  $('dot6').className = t >= 7.0 && t < 9 ? 'on' : '';
  const bp = back(prog(t, 7.5, 8.0));
  $('badge').style.opacity = prog(t, 7.5, 7.7);
  $('badge').style.transform = `translateY(${(30 - 30 * bp).toFixed(1)}px) scale(${(0.9 + 0.1 * bp).toFixed(3)})`;

  // 4. Sunday: line draws left to right, kg counter follows
  const d = easeOut(prog(t, 9.2, 11.0));
  const n = 1 + d * (pts.length - 1);
  const k = Math.floor(n), f = n - k;
  const shown = pts.slice(0, k);
  if (k < pts.length) { const a = pts[k - 1], b = pts[k]; shown.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); }
  const dl = shown.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  $('line').setAttribute('d', dl);
  const last = shown[shown.length - 1];
  $('area').setAttribute('d', dl + ` L${last[0].toFixed(1)} 190 L10 190 Z`);
  $('dotEnd').setAttribute('cx', last[0]); $('dotEnd').setAttribute('cy', last[1]);
  $('kg').textContent = TXT.kgFmt(3.6 * d);
};
render(0);
</script>
</body>
</html>
